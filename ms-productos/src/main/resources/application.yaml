server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ms-productos

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:aws-1-us-east-2.pooler.supabase.com}:${DB_PORT:5432}/${DB_NAME:postgres}?sslMode=${DB_SSL_MODE:require}
    username: ${DB_USER:postgres.uggdzczccgozznhqqawg}
    password: ${DB_PASSWORD:Admin12345vg...}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true